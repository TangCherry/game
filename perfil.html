<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Muscules | Perfil de Neo</title>
  <link rel="stylesheet" href="perfil.css" />
</head>
<body>
  <main class="profile-screen" aria-label="Perfil de Neo">
    <div class="profile-frame">
      <img class="star top-left" src="assets/sparkle.png" alt="" />
      <img class="star top-right" src="assets/sparkle.png" alt="" />
      <img class="star bottom-left" src="assets/sparkle.png" alt="" />
      <img class="star bottom-right" src="assets/sparkle.png" alt="" />
      <a class="back-link" href="index.html" aria-label="Regresar al inicio"><span aria-hidden="true">←</span> Atrás</a>
      <h1 class="profile-name">Neo</h1>
      <section class="equipment" aria-label="Equipo de Neo">
        <img class="character" src="assets/neo.png" alt="Neo con su armadura" />
        <img class="equip hood" src="assets/capa.png" alt="Capucha" title="Capucha" />
        <img class="equip armor" src="assets/armadura.png" alt="Armadura" title="Armadura" />
        <img class="equip sword" src="assets/espada.png" alt="Espada" title="Espada" />
        <img class="equip boots" src="assets/botas.png" alt="Botas" title="Botas" />
      </section>
      <section class="stats" aria-label="Estadísticas de Neo">
        <div class="stat-row"><span class="stat-label">HP</span><div class="meter hp" id="hp-meter" role="progressbar" aria-label="Puntos de vida" aria-valuemin="0" aria-valuemax="28" aria-valuenow="28"><div class="meter-fill" id="hp-fill" style="width:100%"></div><span class="meter-value" id="hp-value">28/28</span></div></div>
        <div class="stat-row"><span class="stat-label">EXP</span><div class="meter exp" id="xp-meter" role="progressbar" aria-label="Progreso de experiencia del nivel actual" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="400"><div class="meter-fill" id="xp-fill" style="width:40%"></div><span class="meter-value" id="xp-value">9,400 XP</span></div></div>
        <div class="stat-row stat-row--atk"><span class="stat-label">ATK</span><span id="atk-value"></span></div>
        <dl class="details"><div><dt>Arma:</dt><dd>Gancho</dd></div><div><dt>Signo:</dt><dd>Sagitario</dd></div><div><dt>Nivel:</dt><dd><span id="level-number">9</span> · Neogon</dd></div></dl>
      </section>
    </div>
  </main>
  <script src="perfil.js"></script>
</body>
</html>
