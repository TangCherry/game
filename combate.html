<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Muscules · Carrotñero</title>
  <link rel="stylesheet" href="combate.css">
</head>

<body>
  <main class="game" id="game">
    <img class="corner tl" src="assets/combate/chispa.png" alt=""><img class="corner tr" src="assets/combate/chispa.png"
      alt=""><img class="corner bl" src="assets/combate/chispa.png" alt=""><img class="corner br"
      src="assets/combate/chispa.png" alt="">
    <section id="battle" class="scene scene--battle">
      <header><a class="back" href="index.html">← Atrás</a>
        <div class="timer"><span>Tiempo restante:</span><strong id="timer" aria-live="off">24:00:00</strong></div>
      </header>
      <div class="enemy">
        <h1>Carrotñero</h1><img class="monster" src="assets/combate/carrotnero.png" alt="Carrotñero">
      </div>
      <div class="battle-panel">
        <div class="stat"><span>HP</span>
          <div class="track hp">
            <div id="enemy-bar" class="fill"></div><b id="enemy-hp">45/45</b>
          </div>
        </div>
        <div class="stat"><span>ATK</span>
          <div class="track atk"><b>8</b></div>
        </div>
        <p class="ability"><strong>Habilidad</strong><span>Tus ataques hacen −3 de daño</span></p>
        <div class="hero-stats"><span>NEOGON</span><span id="hero-hp">28/28 HP</span></div>
        <div class="hero-track">
          <div id="hero-bar"></div>
        </div>
        <p class="log" id="log" role="status">¡Carrotñero te desafía! Neo ataca primero.</p>
        <button class="action" id="roll">🎲 Tirar dado</button>
        <button class="subaction" id="reset">Reiniciar prueba</button>
      </div>
      <a class="exit" href="index.html">Salir</a>
    </section>
    <section id="win" class="scene scene--result win" hidden>
      <h1>¡Victoria!</h1><img class="result-monster" src="assets/combate/carrotnero.png" alt="Carrotñero derrotado">
      <div class="result-copy">
        <p>Recompensa</p>
        <p>30 XP</p><button id="claim" class="claim">Reclamar</button>
        <p class="result-status" id="claim-status"></p>
      </div><a href="index.html" class="result-exit">Salir</a>
    </section>
    <section id="lose" class="scene scene--result lose" hidden>
      <h1>Derrota</h1><img class="result-monster" src="assets/combate/carrotnero.png" alt="Carrotñero">
      <div class="result-copy">
        <p id="lose-reason">Fallecido</p>
        <p id="lose-detail">Sin penalización de XP</p><a class="result-exit" href="index.html">Salir</a>
      </div>
    </section>
  </main>
  <script src="combate.js" defer></script>
</body>

</html>
